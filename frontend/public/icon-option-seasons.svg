<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#F5E4D7" />
  <!-- A drop/petal shape reused 4 times, rotated, representing the 4 seasons/phases of a cycle -->
  <g transform="translate(256, 256)">
    <!-- Spring (Follicular) -->
    <path d="M 0 -30 C -40 -100 0 -190 0 -190 C 0 -190 40 -100 0 -30 Z" fill="#C15F3C" opacity="0.6" />
    <!-- Summer (Ovulation) -->
    <path d="M 30 0 C 100 -40 190 0 190 0 C 190 0 100 40 30 0 Z" fill="#C15F3C" opacity="1.0" />
    <!-- Autumn (Luteal) -->
    <path d="M 0 30 C 40 100 0 190 0 190 C 0 190 -40 100 0 30 Z" fill="#C15F3C" opacity="0.8" />
    <!-- Winter (Menstruation) -->
    <path d="M -30 0 C -100 40 -190 0 -190 0 C -190 0 -100 -40 -30 0 Z" fill="#C15F3C" opacity="0.4" />
    <circle cx="0" cy="0" r="15" fill="#C15F3C" />
  </g>
</svg>
